# .github/workflows/config-check.yml
# Checks config/airwaves.config.yaml and every brand file in config/brands/
# against ourAirwaves' rails, then against the brain (data-edges.yaml and
# tier-gates.yaml, read live from OCR-docs main). The born-red tests run first,
# so a check that can no longer fail turns this job red.

name: Config check

on:
  pull_request:
    paths: ['config/**', 'scripts/**', '.github/workflows/config-check.yml']
  push:
    branches: [main]
    paths: ['config/**', 'scripts/**', '.github/workflows/config-check.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  config-check:
    name: ourAirwaves config rails
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout ourAirwaves
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oaw

      - name: Checkout OCR-docs brain (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ourCommunityRituals/OCR-docs
          path: ocr-docs
          ref: main
          token: ${{ secrets.OCR_HUB_READ }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pyyaml

      - name: Born-red tests for the check
        working-directory: oaw
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Check the config and brand files against the rails and the brain
        working-directory: oaw
        run: python3 scripts/check-config.py --brain ../ocr-docs/ocr-docs-brain
